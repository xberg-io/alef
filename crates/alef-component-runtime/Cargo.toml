[package]
authors = ["Na'aman Hirschfeld <naaman@xberg.io>", "Tobias Perlstein <tobias@xberg.io>"]
name = "alef-component-runtime"
version = "0.127.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Verified downloader and dynamic loader for Alef native components"
homepage = "https://github.com/xberg-io/alef"
repository = "https://github.com/xberg-io/alef"

[features]
# Lets `RootCerts::PlatformVerifier` trust the OS certificate store (TLS-inspecting proxies).
platform-verifier = ["ureq/platform-verifier"]

[dependencies]
alef-component-abi = { path = "../alef-component-abi", version = "0.127.1" }
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8"] }
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ureq = "3"

[lints.clippy]
missing_safety_doc = "deny"
