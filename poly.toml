"tests/backends_wasm_gen_bindings_test.rs" = ["file-too-long"]
"tests/backends_zig_gen_bindings_test.rs" = ["file-too-long"]
"tests/generated_output_downstream_gate.rs" = ["file-too-long"]
"tests/pipeline_regeneration_gate.rs" = ["file-too-long"]
# --- end quality-debt baseline ---
# Quality metrics do not apply to test code. A test function's length is its assertion
# count and a table-driven test's arity mirrors its cases; splitting either to satisfy a
# production-code maintainability metric makes the test harder to read, not easier. Only
# `file-too-long` and `type-too-long` still apply here -- an oversized test FILE is a real
# organisational problem, unlike an oversized test function. ~keep
"**/tests/**" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test/**" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/benches/**" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_tests.rs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/test_*.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/conftest.py" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.test.mjs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.ts" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*.spec.js" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.go" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Test.java" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*Tests.cs" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_test.dart" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
"**/*_spec.rb" = ["cyclomatic-complexity", "function-too-long", "nesting-too-deep", "too-many-parameters"]
# Stylistic rules disabled repo-wide. Each is a formatting or idiom preference with no
# correctness or security consequence, and each fires in volumes no one can hand-maintain
# (`require-unicode-regexp` alone was 724 across the polyrepo, `no-inline-comments` 200).
# `eqeqeq` is here for a stronger reason: every occurrence audited was the deliberate
# `== null` nullish idiom, so the rule had a 100% false-positive rate here.
# Rules with a real correctness or security angle are deliberately NOT listed and stay on:
# unicorn/require-post-message-target-origin, unicorn/no-array-callback-reference,
# unicorn/no-immediate-mutation, unicorn/no-array-fill-with-reference-type. ~keep
"**" = [
  "CPY001",
  "UnorderedKey",
  "eqeqeq",
  "no-inline-comments",
  "no-negated-condition",
  "require-unicode-regexp",
  "unicorn/consistent-function-scoping",
  "unicorn/escape-case",
  "unicorn/explicit-length-check",
  "unicorn/new-for-builtins",
  "unicorn/no-array-sort",
  "unicorn/no-hex-escape",
  "unicorn/no-lonely-if",
  "unicorn/no-negated-condition",
  "unicorn/no-typeof-undefined",
  "unicorn/no-useless-undefined",
  "unicorn/prefer-add-event-listener",
  "unicorn/prefer-at",
  "unicorn/prefer-code-point",
  "unicorn/prefer-dom-node-append",
  "unicorn/prefer-dom-node-remove",
  "unicorn/prefer-import-meta-properties",
  "unicorn/prefer-native-coercion-functions",
  "unicorn/prefer-number-coercion",
  "unicorn/prefer-query-selector",
  "unicorn/prefer-single-call",
  "unicorn/prefer-string-replace-all",
  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
"hooks/**/*.py" = [
  "ANN",
  "ASYNC",
  "B007",
  "C901",
  "CPY001",
  "D",
  "F401",
  "INP001",
  "N806",
  "PLR0912",
  "PLR0915",
  "Q001",
  "RET504",
  "RUF100",
  "S",
  "T201",
]
"scripts/**/*.py" = [
  "ANN",
  "ASYNC",
  "B007",
  "C901",
  "CPY001",
  "D",
  "F401",
  "INP001",
  "N806",
  "PLR0912",
  "PLR0915",
  "Q001",
  "RET504",
  "RUF100",
  "S",
  "T201",
]
# A standalone driver a Rust test executes with `python3 <path>`; it is deliberately not an
# importable package module, so the implicit-namespace-package rule does not apply. Named
# exactly rather than globbed: a glob over the tree would silently exempt every future Python
# file added under it.
"src/e2e/codegen/python/visitor_context_runtime_driver.py" = ["CPY001", "INP001"]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"docs/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
fmt = { exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
file_safety = { added_large_files = false, exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
cargo = true
commit = { stages = ["commit-msg"] }

# ~keep Keep the 500 KiB binary guard repo-wide while allowing the historical changelog to grow;
# the builtin group still checks CHANGELOG.md for conflict markers, private keys, and file metadata.
[hooks.pre-commit.commands.added-large-files]
run = "poly hooks check --added-large-files --max-added-kb 500"
exclude = [
  "CHANGELOG.md",
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

