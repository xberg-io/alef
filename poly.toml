[discovery]
exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[lint.typos]
extend_words = { Prelease = "Prelease", wrkspace = "wrkspace", abl = "abl", unparseable = "unparseable", tring = "tring", ser = "ser", arange = "arange", delocate = "delocate", flate = "flate", CPY = "CPY", mis = "mis", alls = "alls", substantiable = "substantiable", clude = "clude", Confg = "Confg", Respnse = "Respnse", dcoker = "dcoker", pyhton = "pyhton", addresss = "addresss" , caf = "caf", compilability = "compilability" }

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]


[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "HACK", "WORKAROUND", "NOTE", "~keep"]
# MD025 stays enabled for lint but disabled for fmt: rumdl's autofix for a second
# level-1 heading demotes every heading that follows it, which silently reparents a
# whole CHANGELOG under [Unreleased] and breaks release-note extraction. ~keep
[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076", "MD025"]

[lint.python.ruff]
select = ["ALL"]
ignore = [
  "ANN401",
  "ASYNC109",
  "ASYNC110",
  "BLE001",
  "COM812",
  "D100",
  "D104",
  "D107",
  "D205",
  "E501",
  "EM",
  "FBT",
  "FIX",
  "ISC001",
  "PD011",
  "PGH003",
  "PLR2004",
  "PLW0603",
  "S104",
  "S110",
  "S603",
  "TD",
  "TRY",
]
mccabe_max_complexity = 15
pydocstyle_convention = "google"
pylint_max_args = 10
pylint_max_branches = 15
pylint_max_returns = 10

[per-file-ignores]
# `lazy-ignore` fires on Python suppression directives quoted inside Rust PROSE: these
# files document how the generated Python suppression surface works, so they name those
# directives in comments and doc strings. None is an actual directive. Verified at all
# four sites -- and this very comment tripped the rule until it stopped quoting one. ~keep
"src/e2e/codegen/python/lint_clean_python_tests.rs" = ["lazy-ignore"]
"src/scaffold/languages/poly.rs" = ["cyclomatic-complexity", "function-too-long", "lazy-ignore"]
# --- quality-debt baseline (generated) ---
# 1263 size/complexity findings across 687 files that predate these
# metrics. Listed per file rather than switching the rules off, so the metrics still
# fire on every file NOT listed here -- new code stays covered, and each path below is
# one discrete unit of work.
# TODO(xberg-io/alef#338): pay this down file by file and delete each entry as it goes green.
# Do not add new paths here without a very good reason. ~keep
"CHANGELOG.md" = ["file-too-long"]
"scripts/collapse-workspace.py" = ["function-too-long", "nesting-too-deep"]
"scripts/rewrite-crate-paths.py" = ["nesting-too-deep"]
