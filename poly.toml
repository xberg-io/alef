[discovery]
exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[lint.typos]
extend_words = { Prelease = "Prelease", wrkspace = "wrkspace", abl = "abl", unparseable = "unparseable", tring = "tring", ser = "ser", arange = "arange", delocate = "delocate", flate = "flate", CPY = "CPY", mis = "mis", alls = "alls", substantiable = "substantiable", clude = "clude", Confg = "Confg", Respnse = "Respnse", dcoker = "dcoker", pyhton = "pyhton", addresss = "addresss" , caf = "caf", compilability = "compilability" }

[lint.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]


[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "HACK", "WORKAROUND", "NOTE", "~keep"]
# MD025 stays enabled for lint but disabled for fmt: rumdl's autofix for a second
# level-1 heading demotes every heading that follows it, which silently reparents a
# whole CHANGELOG under [Unreleased] and breaks release-note extraction. ~keep
[fmt.markdown.rumdl]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076", "MD025"]

[lint.python.ruff]
select = ["ALL"]
ignore = [
  "ANN401",
  "ASYNC109",
  "ASYNC110",
  "BLE001",
  "COM812",
  "D100",
  "D104",
  "D107",
  "D205",
  "E501",
  "EM",
  "FBT",
  "FIX",
  "ISC001",
  "PD011",
  "PGH003",
  "PLR2004",
  "PLW0603",
  "S104",
  "S110",
  "S603",
  "TD",
  "TRY",
]
mccabe_max_complexity = 15
pydocstyle_convention = "google"
pylint_max_args = 10
pylint_max_branches = 15
pylint_max_returns = 10

[per-file-ignores]
# Stylistic rules disabled repo-wide. Each is a formatting or idiom preference with no
# correctness or security consequence, and each fires in volumes no one can hand-maintain
# (`require-unicode-regexp` alone was 724 across the polyrepo, `no-inline-comments` 200).
# `eqeqeq` is here for a stronger reason: every occurrence audited was the deliberate
# `== null` nullish idiom, so the rule had a 100% false-positive rate here.
# Rules with a real correctness or security angle are deliberately NOT listed and stay on:
# unicorn/require-post-message-target-origin, unicorn/no-array-callback-reference,
# unicorn/no-immediate-mutation, unicorn/no-array-fill-with-reference-type. ~keep
"**" = [
  "CPY001",
  "UnorderedKey",
  "eqeqeq",
  "no-inline-comments",
  "no-negated-condition",
  "require-unicode-regexp",
  "unicorn/consistent-function-scoping",
  "unicorn/escape-case",
  "unicorn/explicit-length-check",
  "unicorn/new-for-builtins",
  "unicorn/no-array-sort",
  "unicorn/no-hex-escape",
  "unicorn/no-lonely-if",
  "unicorn/no-negated-condition",
  "unicorn/no-typeof-undefined",
  "unicorn/no-useless-undefined",
  "unicorn/prefer-add-event-listener",
  "unicorn/prefer-at",
  "unicorn/prefer-code-point",
  "unicorn/prefer-dom-node-append",
  "unicorn/prefer-dom-node-remove",
  "unicorn/prefer-import-meta-properties",
  "unicorn/prefer-native-coercion-functions",
  "unicorn/prefer-number-coercion",
  "unicorn/prefer-query-selector",
  "unicorn/prefer-single-call",
  "unicorn/prefer-string-replace-all",
  "unicorn/prefer-string-slice",
  "unicorn/prefer-top-level-await",
  "unicorn/prefer-type-error",
  "unicorn/require-module-specifiers",
]
"hooks/**/*.py" = [
  "ANN",
  "ASYNC",
  "B007",
  "C901",
  "CPY001",
  "D",
  "F401",
  "INP001",
  "N806",
  "PLR0912",
  "PLR0915",
  "Q001",
  "RET504",
  "RUF100",
  "S",
  "T201",
]
"scripts/**/*.py" = [
  "ANN",
  "ASYNC",
  "B007",
  "C901",
  "CPY001",
  "D",
  "F401",
  "INP001",
  "N806",
  "PLR0912",
  "PLR0915",
  "Q001",
  "RET504",
  "RUF100",
  "S",
  "T201",
]
# A standalone driver a Rust test executes with `python3 <path>`; it is deliberately not an
# importable package module, so the implicit-namespace-package rule does not apply. Named
# exactly rather than globbed: a glob over the tree would silently exempt every future Python
# file added under it.
"src/e2e/codegen/python/visitor_context_runtime_driver.py" = ["CPY001", "INP001"]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"docs/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
fmt = { exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
file_safety = { added_large_files = false, exclude = [
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
cargo = true
commit = { stages = ["commit-msg"] }

# ~keep Keep the 500 KiB binary guard repo-wide while allowing the historical changelog to grow;
# the builtin group still checks CHANGELOG.md for conflict markers, private keys, and file metadata.
[hooks.pre-commit.commands.added-large-files]
run = "poly hooks check --added-large-files --max-added-kb 500"
exclude = [
  "CHANGELOG.md",
  "**/*.jinja",
  "**/*.lock",
  "**/Cargo.lock",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".alef/**",
  ".basemind/**",
  "crates/**",
  "node_modules/**",
  "schemas/**",
  "target/**",
  "tests/snapshots/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate"]

