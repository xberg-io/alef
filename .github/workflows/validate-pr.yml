name: Validate PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    # The reusable workflow comments on and labels non-conforming PRs. ~keep
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: xberg-io/actions/.github/workflows/reusable-validate-pr.yml@v1
    secrets: inherit
