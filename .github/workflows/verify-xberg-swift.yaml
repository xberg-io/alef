name: Verify pinned Xberg Swift consumer
on:
  workflow_dispatch:
    inputs:
      alef_ref:
        description: Immutable candidate Alef commit
        required: true
        type: string
      xberg_ref:
        description: Immutable public Xberg consumer commit
        required: true
        default: 9b0a9387654c592b97b418b4fbf62856ec7fbcbb
        type: string
permissions:
  contents: read
jobs:
  consumer:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: gate
          persist-credentials: false
      # Only the mise binary: the guarded session installs each locked tool into a private data
      # directory itself. ~keep
      - name: Install mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          working-directory: gate
          install: "false"
          cache: "false"
      # `mise run consumer-swift:controls`, then the qualification itself. ~keep
      - name: Qualify real consumer under guarded stages
        env:
          ALEF_REF: ${{ inputs.alef_ref }}
          XBERG_REF: ${{ inputs.xberg_ref }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 gate/scripts/consumer-swift/entry.py --controls && python3 gate/scripts/consumer-swift/entry.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xberg-swift-consumer-receipts
          path: |
            consumer-evidence
            ${{ runner.temp }}/consumer-controls-evidence
          if-no-files-found: error
