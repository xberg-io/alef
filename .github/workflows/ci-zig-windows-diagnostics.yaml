name: Windows Zig diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ci-zig-windows-diagnostics.yaml
      - .task/zig-diagnostics.yml
      - Taskfile.yml
      - scripts/zig-diagnostics/**
      - src/snippets/validators/zig.rs
      - src/snippets/validators/zig/**

permissions:
  contents: read

concurrency:
  group: zig-windows-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify cold and warm Zig consumers
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ALEF_ZIG_DIAGNOSTIC_DIR: ${{ github.workspace }}/zig-diagnostics
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: xberg-io/actions/install-task@f2be77fcc9149c34363aa08de6ba8abb60b04d0c
        with:
          version: "3.54.0"
      - uses: xberg-io/actions/setup-rust@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          install-llvm-cov: "false"
          cache-key-prefix: zig-windows-diagnostics
      - uses: xberg-io/actions/setup-zig@cc89740654cef67b752113ddd87d4f0d23dda3f5
        with:
          version: "0.17.0"
      - name: Qualify process accounting and failure controls
        run: task zig-diagnostics:controls
      - name: Build the diagnostic fixture
        run: task zig-diagnostics:prepare
      - name: Capture eight real cold and warm compiler checks
        run: task zig-diagnostics:run
      - name: Preserve process samples, controls and compiler receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-zig-diagnostics
          path: ${{ env.ALEF_ZIG_DIAGNOSTIC_DIR }}
          if-no-files-found: error
