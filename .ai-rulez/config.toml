
version = "5.0"
name = 'Alef'
description = 'Polyglot binding generator that produces type-safe language bindings for Rust libraries with generator backends for C#, Dart, R/extendr, C FFI, Gleam, Go, Java, JNI, Kotlin, Kotlin Android, Ruby/Magnus, Node/NAPI, PHP, Python/PyO3, Elixir/Rustler, Swift, WASM, and Zig'
gitignore = true
presets = ["claude", "codex", "opencode"]
compact = true
builtins = [
  "!agent-delegation",
  "!ai-governance/agent-workflow",
  "!git-workflow",
  "!testing/test-alongside-code",
  "!testing/tdd-workflow",
  "!token-efficiency/output-awareness",
  "!token-efficiency/task-runner",
  "!ai-governance/explain-reasoning",
  "!security/least-privilege",
  "!security/input-validation",
  "default-commands",
]

default_layers = ["plugins"]

[header]
style = 'minimal'

[defaults]
effort = 'medium'

[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
version = "^1"
path = 'modules/cicd'
merge_strategy = 'local-override'


[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[codex]
project_doc_max_bytes = 65536

[[mcp_servers]]
name = "playwright"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83"]

[exposure]
mcp_server_tokens = 1150
start_budget = 7350
codex_start_budget = 8250

[lock]
include_outputs = false

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
# ~keep One fallback skill per directory keeps the Codex skill listing under its budget (AR964).
scoped_fallback_group = "directory"
