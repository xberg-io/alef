[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]
task.run_auto_install = false

[tools]
dart = "3.13.7"

[tasks.sdk]
run = "dart --version"

[tasks.setup]
run = "cd packages/dart && dart pub get --offline"

[tasks.build]
run = "cargo build --offline --jobs 1 --manifest-path packages/dart/rust/Cargo.toml"

[tasks.test]
run = "cd packages/dart && dart run check.dart"
