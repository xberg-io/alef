version: "3"

vars:
  RUST_LOG: info

tasks:
  setup:
    desc: "Set up the development environment"
    cmds:
      - rustup update stable
      - cargo install cargo-deny || true
      - cargo install cargo-machete || true
      - cargo install cargo-sort || true
      - cargo install cargo-edit || true
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - poly hooks install

  update:
    desc: "Update dependencies"
    cmds:
      - cargo update
      - gau --update .

  upgrade:
    desc: "Upgrade dependencies to latest (including incompatible) then update"
    cmds:
      - cargo upgrade --incompatible
      - task: update

  build:
    desc: "Build all crates"
    cmds:
      - cargo build --workspace

  build:release:
    desc: "Build release binary"
    cmds:
      - cargo build --release -p alef

  test:
    desc: "Run all tests"
    cmds:
      - rm -rf target/toolchain-census
      - cargo test --workspace
      - task: test:census

  test:census:
    desc: "Report how many toolchain-dependent fixtures the last test run actually executed"
    cmds:
      # No `--require` locally: a contributor without Go or Swift installed should see the ratio,
      # not a failure. CI passes `--require` for the toolchains its runner installs, which is
      # where a zero-execution run has to be fatal.
      - ./scripts/toolchain-census.sh

  test:release:
    desc: "Run all tests in release mode (catches release-only optimizer/lifetime issues)"
    cmds:
      - cargo test --release --workspace

  gate:generated-output:
    desc: "Run the consumer toolchain gate (clippy, cargo sort, poly fmt) over an emitted tree"
    cmds:
      - cargo test --test generated_output_downstream_gate -- --nocapture
      - cargo test --test generated_output_downstream_gate -- --ignored --nocapture

  gate:generated-output:text:
    desc: "Generated-output gate, text lanes only (cargo sort + poly fmt + cargo manifest bytes; compiles nothing)"
    cmds:
      - cargo test --test generated_output_downstream_gate -- --ignored --nocapture cargo_sort
      - cargo test --test generated_output_downstream_gate -- --ignored --nocapture poly_fmt
      - cargo test --test generated_output_downstream_gate -- --ignored --nocapture cargo_manifest_byte

  bench:
    desc: "Run codegen benchmarks (criterion)"
    cmds:
      - cargo bench

  check:
    desc: "Type-check all crates"
    cmds:
      - cargo check --workspace

  fmt:
    desc: "Format all code via poly"
    cmds:
      - poly fmt --fix .

  format:
    desc: "Format all code via poly"
    cmds:
      - poly fmt --fix .

  format:check:
    desc: "Check formatting via poly (CI)"
    cmds:
      - poly fmt --check .

  lint:
    desc: "Run all linters via poly"
    cmds:
      - poly lint .

  lint:check:
    desc: "Run check-only linting via poly (CI)"
    cmds:
      - poly lint .

  lint:file-size:
    desc: "Enforce the 1,000-line file cap: over-cap files may shrink, never grow"
    cmds:
      - cargo test --test file_size_ratchet

  lint:file-size:tighten:
    desc: "Rewrite tests/file_size_baseline.txt from the working tree (run after splitting a file)"
    cmds:
      - UPDATE_FILE_SIZE_BASELINE=1 cargo test --test file_size_ratchet -- --nocapture

  set-version:
    desc: "Set package version (usage: task set-version -- 0.18.0 or 0.18.0-rc.1)"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - |
        version="{{.CLI_ARGS}}"
        version="${version#v}"
        if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$'; then
          echo "set-version: expected semver like '0.18.0' or '0.18.0-rc.1' (with or without leading 'v'); got '{{.CLI_ARGS}}'" >&2
          exit 2
        fi
        sed -i.bak "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
        rm -f Cargo.toml.bak
        sed -i.bak "s/^alef_version = \".*\"/alef_version = \"$version\"/" alef.toml
        rm -f alef.toml.bak
        sed -i.bak -E "s|pub const ALEF_REV: &str = \"v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?\";|pub const ALEF_REV: \&str = \"v$version\";|" src/core/template_versions.rs
        rm -f src/core/template_versions.rs.bak
        CARGO_TARGET_DIR=target/schema-task cargo run --quiet -- schema --schema-version "$version" --output schemas/alef.schema.json
      - cargo update

  clean:
    desc: "Clean build artifacts"
    cmds:
      - cargo clean
      - rm -rf .alef/
